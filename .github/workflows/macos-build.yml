name: macOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Universal binary (Apple Silicon + Intel), macOS 11.0+
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build beta app (15-day)
        run: cmake --build build --config Release --target SuperrackBeta --parallel 3

      - name: Build and run headless tests
        run: |
          cmake --build build --config Release --target SuperrackTests --parallel 3
          TESTBIN=$(find build -type f -name "SuperrackTests" -perm +111 | head -1)
          echo "Running: $TESTBIN"
          "$TESTBIN"

      - name: Package app as DMG
        run: |
          APP=$(find build/SuperrackBeta_artefacts -type d -name "*.app" | head -1)
          echo "Packaging: $APP"
          lipo -info "$APP/Contents/MacOS/"*
          # 링커 서명만으로는 Gatekeeper 가 "no usable signature" 로 거부한다 —
          # 번들 전체 ad-hoc 재서명으로 유효한 서명을 만든다 (공증은 아님:
          # 최초 실행은 여전히 시스템 설정 "그래도 열기" 필요).
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Superrack Beta" -srcfolder dmg-root -ov -format UDZO "Superrack-Beta-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Superrack-Beta-macOS
          path: Superrack-Beta-macOS.dmg