name: Windows Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # JUCE 8.0.11+ 는 ASIO SDK 헤더를 번들 — 외부 SDK 없이 JUCE_ASIO=1 로 빌드된다.
      - name: Configure
        run: cmake -B build

      - name: Build beta app (15-day)
        run: cmake --build build --config Release --target SuperrackBeta --parallel 4

      - name: Build headless tests
        run: cmake --build build --config Release --target SuperrackTests --parallel 4

      - name: Run headless tests
        run: build/SuperrackTests_artefacts/Release/SuperrackTests.exe

      - name: Package beta zip
        run: |
          $exe = Get-ChildItem -Recurse build/SuperrackBeta_artefacts -Filter *.exe | Select-Object -First 1
          Write-Host "Packaging: $($exe.FullName)"
          Compress-Archive -Path $exe.FullName -DestinationPath SuperrackBeta-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SuperrackBeta-win
          path: SuperrackBeta-win.zip
          retention-days: 15
