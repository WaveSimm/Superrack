name: macOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Universal binary (Apple Silicon + Intel), macOS 11.0+
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build beta app (15-day)
        run: cmake --build build --config Release --target SuperrackBeta --parallel 3

      - name: Build and run headless tests
        run: |
          cmake --build build --config Release --target SuperrackTests --parallel 3
          TESTBIN=$(find build -type f -name "SuperrackTests" -perm +111 | head -1)
          echo "Running: $TESTBIN"
          "$TESTBIN"

      - name: Package app
        run: |
          APP=$(find build/SuperrackBeta_artefacts -type d -name "*.app" | head -1)
          echo "Packaging: $APP"
          lipo -info "$APP/Contents/MacOS/"*
          ditto -c -k --keepParent "$APP" Superrack-Beta-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Superrack-Beta-macOS
          path: Superrack-Beta-macOS.zip